<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillAssign - Employees</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b1120;
      --sidebar-bg: #0f172a;
      --card-bg: #151f32;
      --table-header: #1b273d;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent-purple: #7c3aed;
      --purple-gradient: linear-gradient(135deg, #8b5cf6, #6d28d9);
    }

    body {
      font-family: "Inter", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      caret-color: transparent;
    }

    input, textarea {
      caret-color: auto;
    }

    button, input {
      font: inherit;
    }

    button {
      color: inherit;
      border: 0;
      background: none;
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: flex;
    }

    /* SIDEBAR */
    .sidebar {
      width: 220px;
      min-width: 220px;
      min-height: 100vh;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 10;
    }

    .sidebar-bottom {
  margin-top: auto;
  padding: 16px;
  border-top: 1px solid var(--border);
}

.goal-card {
  position: relative;
  min-height: 125px;
  margin-top: 10px;
  padding: 16px 14px;
  overflow: hidden;
  border: 1px solid rgba(100, 111, 255, .22);
  border-radius: 9px;
  background: linear-gradient(145deg, rgba(28, 25, 89, .85), rgba(12, 30, 72, .95));
  color: #eef1ff;
  font-size: 11px;
  line-height: 1.55;
}

.goal-icon {
  color: #c85aff;
  font-size: 22px;
  margin-bottom: 8px;
}

.goal-glow {
  position: absolute;
  width: 100px;
  height: 100px;
  right: -35px;
  bottom: -50px;
  border-radius: 50%;
  background: #5725dc;
  filter: blur(30px);
}

    .brand {
      height: 64px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      font-weight: 800;
      font-size: 18px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--purple-gradient);
      box-shadow: 0 0 15px rgba(124, 58, 237, 0.4);
      font-size: 14px;
    }

    .nav {
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      width: 100%;
      height: 40px;
      border-radius: 8px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
      text-align: left;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    .nav-item.active {
      color: #fff;
      background: var(--accent-purple);
    }

    .nav-icon {
      width: 20px;
      text-align: center;
      font-size: 16px;
    }

    .sidebar-bottom {
      margin-top: auto;
      padding: 16px;
      border-top: 1px solid var(--border);
    }

    /* MAIN CONTENT AREA */
    .main {
      margin-left: 220px;
      width: calc(100% - 220px);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 64px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: var(--sidebar-bg);
    }

    .search-box {
      width: 320px;
      height: 38px;
      display: flex;
      align-items: center;
      gap: 10px;
       margin-left: 40%;
      padding: 0 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .search-box span {
      color: var(--muted);
      font-size: 15px;
    }

    .search-box input {
      width: 100%;
      outline: 0;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 13px;
    }

    .search-box input::placeholder {
      color: var(--muted);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

  

    .admin {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
    }

    .avatar {
  width: 31px;
  height: 31px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, #ffd59e, #bf6c50);
  color: #421d18;
  font-weight: 800;
}


    .dropdown-arrow {
      font-size: 10px;
      color: var(--muted);
    }

    /* CONTENT PAGE */
    .content {
      padding: 24px 28px;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .page-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .page-heading .header-title {
      margin-bottom: 0;
    }

    .primary-btn {
      padding: 11px 16px;
      border-radius: 8px;
      color: #fff;
      background: var(--accent-purple);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .primary-btn:hover {
      background: #8b5cf6;
    }

    /* METRIC STATS CARDS */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* EMPLOYEES TABLE PANEL */
    .table-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    th {
      background: var(--table-header);
      color: var(--muted);
      font-weight: 600;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      letter-spacing: 0.3px;
    }

    td {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      color: #e2e8f0;
      white-space: nowrap;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.01);
    }

    /* SKILL TAGS */
    .skills-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .skill-tag {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #38bdf8;
    }

    /* STATUS BADGES */
    .status-badge {
      display: inline-flex;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-badge.allocated {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    .status-badge.available {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
    }

    .status-badge.bench {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
    }

    /* ACTION BUTTONS */
    .action-buttons {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      transition: 0.2s;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .action-btn.delete:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    /* TABLE PAGINATION FOOTER */
    .table-footer {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid var(--border);
      background: var(--card-bg);
    }

    .page-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }

    .page-btn.active {
      background: var(--accent-purple);
      border-color: var(--accent-purple);
      color: #fff;
    }

    /* SEARCH HIGHLIGHT */
    .search-match {
      outline: 1px solid var(--accent-purple);
      background: rgba(124, 58, 237, 0.08) !important;
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 1024px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 70px;
        min-width: 70px;
      }
      .sidebar .brand span,
      .sidebar .nav-item span:not(.nav-icon) {
        display: none;
      }
      .main {
        margin-left: 70px;
        width: calc(100% - 70px);
      }
      .search-box {
        width: 180px;
      }
    }
  </style>
</head>
<body>
  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">✦</div>
        <span>Talent Optima</span>
      </div>

      <nav class="nav" id="sidebarNav">
        <button class="nav-item" data-page="Dashboard">
          <span class="nav-icon">⌂</span>
          <span>Dashboard</span>
        </button>
        <button class="nav-item active" data-page="Employees">
          <span class="nav-icon">♧</span>
          <span>Employees</span>
        </button>
        <button class="nav-item" data-page="Projects">
          <span class="nav-icon">▣</span>
          <span>Projects</span>
        </button>
        <button class="nav-item" data-page="Assignments">
          <span class="nav-icon">♙</span>
          <span>Assignments</span>
        </button>
        <button class="nav-item" data-page="Reports">
          <span class="nav-icon">▤</span>
          <span>Reports</span>
        </button>
      </nav>

     <div class="sidebar-bottom">
        <div class="goal-card">
          <div class="goal-icon">◎</div>
          <strong>Better Skills<br>Better Teams<br>Bigger Goals</strong>
          <div class="goal-glow"></div>
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <header class="topbar">
        <div class="search-box">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="Search employees...">
        </div>

        <div class="top-actions">
         
          <div class="admin">
            <div class="avatar">A</div>
            <span>Admin</span>
          </div>
        </div>
      </header>

      <div class="content">
        <div class="page-heading">
          <h1 class="header-title">Employees</h1>
          <a class="primary-btn" href="add-employee.html">＋ Add Employee</a>
        </div>

        <!-- STAT CARDS -->
        <section class="stats-grid">
          <div class="stat-card">
            <span class="stat-label">Total Employees</span>
            <span class="stat-value" id="employeeTotalCount">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Allocated</span>
            <span class="stat-value" id="employeeAllocatedCount">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Bench / Available</span>
            <span class="stat-value" id="employeeAvailableCount">0</span>
          </div>
        </section>

        <!-- EMPLOYEES TABLE -->
        <section class="table-panel">
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Emp ID</th>
                  <th>Name</th>
                  <th>Role</th>
                  <th>Skills</th>
                  <th>Projects</th>
                  <th>Workload</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="employeesTableBody"></tbody>
            </table>
          </div>
          <div class="table-footer">
            <button class="page-btn">‹</button>
            <button class="page-btn active">1</button>
            <button class="page-btn">›</button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="employee-data.js"></script>
  <script>
    const employeesData = SkillAssignEmployeeStore.getAll();

    // RENDER EMPLOYEES TABLE
    function escapeEmployeeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
    }

    function renderEmployees() {
      const tbody = document.getElementById("employeesTableBody");
      const activeAssignments = JSON.parse(localStorage.getItem("skillAssignAssignments") || "[]");
      const projects = JSON.parse(localStorage.getItem("skillAssignProjects") || "[]");
      const projectsById = new Map(projects.map(project => [project.id, project]));
      employeesData.splice(0, employeesData.length, ...SkillAssignEmployeeStore.syncWorkloads(activeAssignments));
      document.getElementById("employeeTotalCount").textContent = employeesData.length;
      document.getElementById("employeeAllocatedCount").textContent = employeesData.filter(employee => employee.status === "Allocated").length;
      document.getElementById("employeeAvailableCount").textContent = employeesData.filter(employee => employee.status !== "Allocated").length;
      tbody.innerHTML = employeesData.map(emp => {
        const status = emp.status;
        const statusClass = status.toLowerCase().replace(/\s+/g, '-');
        const assignedProjects = activeAssignments.filter(assignment =>
          assignment.employeeId === emp.id && ["Active", "Pending"].includes(assignment.status)
        ).map(assignment => projectsById.get(assignment.projectId)?.name).filter(Boolean);
        const uniqueProjects = [...new Set(assignedProjects)];
        const searchable = `${emp.id} ${emp.name} ${emp.role} ${(emp.skills || []).join(" ")} ${uniqueProjects.join(" ")} ${status}`.toLowerCase();
        
        return `
          <tr class="data-row" data-search="${escapeEmployeeHtml(searchable)}">
            <td>${escapeEmployeeHtml(emp.id)}</td>
            <td style="font-weight: 600;">${escapeEmployeeHtml(emp.name)}</td>
            <td>${escapeEmployeeHtml(emp.role)}</td>
            <td>
              <div class="skills-wrapper">
                ${(emp.skills || []).map(skill => `<span class="skill-tag">${escapeEmployeeHtml(skill)}</span>`).join("")}
              </div>
            </td>
            <td>${uniqueProjects.length ? uniqueProjects.map(project => `<div>${escapeEmployeeHtml(project)}</div>`).join("") : '<span class="list-meta">No projects assigned</span>'}</td>
            <td>${emp.allocatedWorkload || 0}% allocated<div class="list-meta">${emp.availableWorkload ?? 100}% available</div></td>
            <td><span class="status-badge ${statusClass}">${escapeEmployeeHtml(status)}</span></td>
            <td>
              <div class="action-buttons">
                <button class="action-btn" type="button" data-action="edit" data-id="${escapeEmployeeHtml(emp.id)}" title="Edit" aria-label="Edit ${escapeEmployeeHtml(emp.name)}">✎</button>
                <button class="action-btn delete" type="button" data-action="delete" data-id="${escapeEmployeeHtml(emp.id)}" title="Delete" aria-label="Delete ${escapeEmployeeHtml(emp.name)}">🗑</button>
              </div>
            </td>
          </tr>
        `;
      }).join("");
    }

    // SETUP LIVE SEARCH FILTERING
    function setupSearch() {
      const input = document.getElementById("searchInput");
      input.addEventListener("input", () => {
        const query = input.value.trim().toLowerCase();
        document.querySelectorAll(".data-row").forEach(row => {
          const searchable = row.dataset.search || "";
          const matched = !query || searchable.includes(query);
          row.style.display = matched ? "" : "none";
          row.classList.toggle("search-match", !!query && matched);
        });
      });
    }

    function deleteEmployee(id) {
      const employee = employeesData.find(item => item.id === id);
      if (!employee || !window.confirm(`Delete ${employee.name} (${id}), its assignments, and project-leader references? This cannot be undone.`)) return;

      const keys = ["skillAssignEmployees", "skillAssignAssignments", "skillAssignProjects"];
      const previousValues = new Map(keys.map(key => [key, localStorage.getItem(key)]));
      try {
        const assignments = JSON.parse(previousValues.get("skillAssignAssignments") || "[]");
        const projects = JSON.parse(previousValues.get("skillAssignProjects") || "[]");
        if (!Array.isArray(assignments) || !Array.isArray(projects)) {
          throw new Error("Saved assignment or project data is invalid.");
        }

        SkillAssignEmployeeStore.save(employeesData.filter(item => item.id !== id));
        localStorage.setItem("skillAssignAssignments", JSON.stringify(assignments.filter(item => item.employeeId !== id)));
        localStorage.setItem("skillAssignProjects", JSON.stringify(projects.map(project =>
          project.projectLeaderId === id ? { ...project, projectLeaderId: "", projectLeaderName: "" } : project
        )));
        SkillAssignEmployeeStore.syncWorkloads(JSON.parse(localStorage.getItem("skillAssignAssignments") || "[]"));
        employeesData.splice(0, employeesData.length, ...SkillAssignEmployeeStore.getAll());
        renderEmployees();
      } catch (error) {
        try {
          previousValues.forEach((value, key) => {
            if (value === null) localStorage.removeItem(key);
            else localStorage.setItem(key, value);
          });
        } catch (restoreError) {
          alert(`Employee deletion failed and saved data could not be fully restored: ${restoreError.message}`);
          return;
        }
        alert(`Unable to delete employee: ${error.message}`);
      }
    }

    // SETUP SIDEBAR NAVIGATION ACTIVE STATES
    function setupNavigation() {
      const pageRoutes = {
        Dashboard: "dashboard.html",
        Employees: "employee.html",
        Projects: "projects.html",
        Assignments: "assignments.html",
        Reports: "reports.html",
      };

      document.querySelectorAll(".nav-item").forEach(button => {
        button.addEventListener("click", () => {
          const destination = pageRoutes[button.dataset.page];

          if (destination) {
            window.location.href = destination;
          }
        });
      });
    }

    // INITIALIZE APP
    function init() {
      renderEmployees();
      setupSearch();
      setupNavigation();
      document.getElementById("employeesTableBody").addEventListener("click", event => {
        const button = event.target.closest("[data-action]");
        if (!button) return;
        if (button.dataset.action === "edit") {
          window.location.href = `add-employee.html?id=${encodeURIComponent(button.dataset.id)}`;
        } else if (button.dataset.action === "delete") {
          deleteEmployee(button.dataset.id);
        }
      });
    }

    document.addEventListener("DOMContentLoaded", init);
    window.addEventListener("storage", event => {
      if (["skillAssignAssignments", "skillAssignEmployees", "skillAssignProjects"].includes(event.key)) {
        try {
          employeesData.splice(0, employeesData.length, ...SkillAssignEmployeeStore.getAll());
          renderEmployees();
        } catch (error) {
          console.error("Unable to refresh employee availability:", error);
        }
      }
    });
  </script>
</body>
</html>
